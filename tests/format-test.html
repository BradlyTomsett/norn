<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>format test</title></head>
<body><pre id="out">running…</pre>
<script type="module">
import { format, esc, pruneEmpty, splitDelta, stripDataBlocks, stripSheet } from '../format.js';

const lines = [];
const ok = (n, c, extra = '') => lines.push(`${c ? 'PASS' : 'FAIL'} ${n}${extra ? ' :: ' + extra : ''}`);

const sample = '第一段。\n\n\n第二段，前面有两个空行。\n\n【本回合】\n内容。\n\n\n━━━━━━\n结尾。\n';
const html = format(sample);

ok('不产生空段落', !html.includes('&nbsp;'));
ok('没有连续空 <p></p>', !html.includes('<p></p>'));
ok('章节标题保留样式', html.includes('<p class="sec">【本回合】</p>'));
ok('分隔线保留', html.includes('<p class="rule">'));
ok('段落数正确（4 正文 + 标题 + 分隔线）', (html.match(/<p/g) || []).length === 6, String((html.match(/<p/g) || []).length));
ok('行首尾空格被去掉', html.includes('<p>第二段，前面有两个空行。</p>'));
ok('HTML 被转义', esc('<b>') === '&lt;b&gt;');
ok('空输入不炸', format('') === '' && format(null) === '');

// 计算一下空行减少量
const before = (sample.match(/\n/g) || []).length;
const after = (html.match(/<p/g) || []).length;
lines.push(`空行：原文 ${before} 个换行（其中 3 个连续空行）→ 输出 ${after} 个段落，零空段落`);

/* ---------- 空段落 / 重复段落 ---------- */

const withEmptyWorld = `【本次行动】
你进了铺子。

【世界动态】
无

【你现在可以做什么】
① 看看`;
const pruned = pruneEmpty(withEmptyWorld);
ok('整段是「无」的小节被删掉', !pruned.includes('【世界动态】'), pruned.replace(/\n/g, ' / '));

const noNews = `【世界动态】
暂无新消息
`;
ok('「暂无」也算空', pruneEmpty(noNews).trim() === '', JSON.stringify(pruneEmpty(noNews)));

const dup = `【当地动态】
镇上的粮价又涨了，东头那家铺子关了门。

【世界动态】
镇上的粮价又涨了，东头那家铺子关了门。
`;
const dedup = pruneEmpty(dup);
ok('【世界动态】复述【当地动态】的那句被去掉', !dedup.includes('【世界动态】'), dedup.replace(/\n/g, ' / '));
ok('原句还在', dedup.includes('镇上的粮价又涨了'));

const twice = `【世界动态】
北边来了商队。

【世界动态】
北边来了商队。
`;
ok('同一小节出现两次只留一次', (pruneEmpty(twice).match(/【世界动态】/g) || []).length === 1);

const shortRepeat = `【人物关系】
他点头。

【世界动态】
他点头。
`;
ok('太短的行不做去重', (pruneEmpty(shortRepeat).match(/他点头。/g) || []).length === 2);

/* ---------- stripSheet ---------- */

const sheet = `【本次行动】
你进了铺子。

【当前角色】
马大爷｜18 岁｜人类
四维：135 / 130 / 99 / 116
资产｜现金｜债务

【世界动态】
北边来了商队。

【你现在可以做什么】
① 看看

━━━━━━━━━━
【玩家自由行动】`;
const stripped = stripSheet(sheet);
ok('去掉【当前角色】大表', !stripped.includes('【当前角色】') && !stripped.includes('四维：'), stripped.replace(/\n/g, ' / '));
ok('保留后面的【世界动态】', stripped.includes('【世界动态】'));
ok('去掉结尾【玩家自由行动】', !stripped.includes('【玩家自由行动】'));
ok('正文本体还在', stripped.includes('你进了铺子。'));

const fix = `【本次行动】
你进了铺子。
修正：上一条写错了。
更正：其实是粮行。`;
const fixed = stripSheet(fix);
ok('去掉「修正/更正」自言自语', !fixed.includes('修正') && !fixed.includes('更正'), fixed.replace(/\n/g, ' / '));

ok('stripSheet 空输入不炸', stripSheet('') === '' && stripSheet(null) === '');

/* ---------- 整条管线：和 app.js 里跑的完全一致 ---------- */

const modelOut = `【本次行动】
你推开铺子的门，铜铃响了一声。

【世界动态】
无

【当前角色】
马大爷｜18 岁
四维：135 / 130 / 99 / 116

【你现在可以做什么】
① 问价
② 走人

\`\`\`json
{"trade":{"buy":[{"name":"黑面包","qty":2}]}}
\`\`\``;

let pipelineOk = true;
let html2 = '';
let delta = null;
try {
  const split = splitDelta(modelOut);
  delta = split.delta;
  html2 = format(pruneEmpty(stripSheet(split.text)));
} catch (e) {
  pipelineOk = false;
  html2 = String(e);
}
ok('管线不抛异常（这次线上就是这里炸的）', pipelineOk, html2.slice(0, 60));
ok('json 被解析出来', delta && delta.trade && delta.trade.buy[0].name === '黑面包');
ok('正文保留', html2.includes('铜铃响了一声'));
ok('空的世界动态被删掉', !html2.includes('世界动态'));
ok('【当前角色】被删掉', !html2.includes('当前角色'));
ok('输出里没有空段落', !html2.includes('&nbsp;'));

/* ---------- 数值块的容错：模型经常写坏或写一半 ---------- */

const trailingComma = '正文。\n\n```json\n{"mind":{"mood":"有点累",},}\n```';
const tc = splitDelta(trailingComma);
ok('尾逗号能救回来', tc.delta && tc.delta.mind.mood === '有点累', JSON.stringify(tc.delta));
ok('正文不含 JSON', !tc.text.includes('有点累'), tc.text);

const truncated = '正文。\n\n```json\n{"money":{"cash":-300},"relations":[{"npcId":"npc_mother","trust":1';
const tr = splitDelta(truncated);
ok('截断的 JSON 能补齐', tr.delta && tr.delta.money.cash === -300, JSON.stringify(tr.delta));

const bare = '正文写完了。\n{"skills":["商谈"]}';
const bd = splitDelta(bare);
ok('没有代码块也认裸 JSON', bd.delta && bd.delta.skills[0] === '商谈', JSON.stringify(bd.delta));
ok('裸 JSON 从正文里剔掉', !bd.text.includes('"skills"'), bd.text);

const smart = '正文。\n```json\n{“mind”：{“mood”：“平静”}}\n```';
const sm = splitDelta(smart);
ok('中文引号能救回来', sm.delta && sm.delta.mind.mood === '平静', JSON.stringify(sm.delta));

const BT = String.fromCharCode(96, 96, 96);
const NL = String.fromCharCode(10);

const unterminated = '正文。' + NL + BT + 'json' + NL + '{"mind":{"mood":"平静"}}';
const ut = splitDelta(unterminated);
ok('没有收尾的代码块也能剥掉', !ut.text.includes('mind') && ut.text.includes('正文'));
ok('没有收尾也能解析出增量', ut.delta && ut.delta.mind.mood === '平静');

const badBlock = '正文。' + NL + BT + 'json' + NL + '{不是 json' + NL + BT;
const bt = splitDelta(badBlock);
ok('坏 JSON 也不显示在正文里', !bt.text.includes('不是 json'), bt.text);

const middle = '正文。' + NL + '{"mind":{"mood":"平静"}}' + NL + '【你现在可以做什么】' + NL + '① 看看';
const md = splitDelta(middle);
ok('夹在中间也能剥掉', !md.text.includes('"mind"') && md.text.includes('【你现在可以做什么】'), md.text);
ok('夹在中间也能解析', md.delta && md.delta.mind.mood === '平静');
// 展示层兜底：无论解析成不成功，JSON 都不该出现在气泡里
const leak = '正文一段。' + NL + '{"relations":[{"npcId":"npc_sera","trust":1}],"mind":{"mood":"盯车"}}';
ok('format 兜底删掉裸 JSON', !format(leak).includes('npc_sera'), format(leak));
ok('format 保留正文', format(leak).includes('正文一段'));
ok('stripDataBlocks 删围栏块', !stripDataBlocks('前' + NL + BT + 'json' + NL + '{"a":1}' + NL + BT + NL + '后').includes('"a"'));
const broken = '正文，没有任何 JSON。';
const bk = splitDelta(broken);
ok('真的没有就返回 null', bk.delta === null && bk.text.includes('正文'));

document.getElementById('out').textContent = lines.join('\n');
</script></body></html>
