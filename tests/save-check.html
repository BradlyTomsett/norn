<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>save migration check</title></head>
<body><pre id="out">running…</pre>
<script type="module">
import { applyDelta, stateBlock, uiState } from '../engine/state.js';
import { copperText, accountOf } from '../engine/money.js';
import { openDebts } from '../engine/ledger.js';
import { migrateSave } from '../engine/migrate.js';
import { priceOf } from '../engine/economy.js';
import { trainSkill } from '../engine/progress.js';
import { makeRng } from '../engine/rng.js';

const files = ['../../saves/sv_afb0003b.json', '../../saves/sv_hooln0f0.json'];
const out = [];

for (const f of files) {
  out.push('==== ' + f);
  try {
    const s = await (await fetch(f)).json();
    out.push(`回合 ${s.turn}｜${s.player.name}｜${s.player.profession}｜天赋 ${s.player.talent?.grade}`);

    const r = migrateSave(s);
    out.push(`装备 ${r.before.equipment} → ${r.after.equipment} 件；搬进袋子 ${r.moved.length} 条；药剂包 ${r.containers} 个`);
    out.push('  搬走：' + r.moved.slice(0, 8).join('、') + (r.moved.length > 8 ? ' …' : ''));
    out.push(`袋子（${(s.player.bag || []).length} 种）：` + (s.player.bag || []).map((b) => `${b.name}×${b.qty}`).join('、'));
    out.push(`产业 ${r.industries}｜牲畜 ${r.livestock}｜存货 ${r.stock}`);
    out.push('  产业：' + (s.player.industries || []).map((i) => `${i.name}(月 ${i.monthly})`).join('、'));
    out.push('  牲畜：' + (s.player.livestock || []).map((i) => `${i.name}×${i.qty}`).join('、'));
    out.push('  存货：' + (s.player.stock || []).map((i) => `${i.name}×${i.qty}`).join('、'));

    // 幂等：再跑一次应该什么都不变
    const bagKey = JSON.stringify(s.player.bag);
    const eqKey = JSON.stringify(s.player.equipment);
    const r2 = migrateSave(s);
    out.push(`再跑一次：新增 ${r2.moved.length} 条，袋子/装备未变 ${bagKey === JSON.stringify(s.player.bag) && eqKey === JSON.stringify(s.player.equipment)}`);

    // 用一瓶回血药水
    const hp0 = s.player.body.health;
    applyDelta(s, { use: [{ name: '回血', qty: 1 }] }, makeRng(3), {});
    const after = (s.player.bag || []).find((b) => b.name === '回血');
    out.push(`用 1 瓶回血：血 ${hp0} → ${s.player.body.health}，剩 ${after ? after.qty : 0}`);

    // 状态块
    const block = stateBlock(s);
    out.push(`状态块 ${block.length} 字`);
    out.push('  ' + block.split('\n').filter((l) => /【资产】|【随身货物】|【身份】|【账户】/.test(l)).map((l) => l.slice(0, 90)).join('\n  '));
    const ui = uiState(s);
    out.push(`UI：产业 ${ui.player.industries.length}｜牲畜 ${ui.player.livestock.length}｜存货 ${ui.player.stock.length}｜声誉 ${ui.player.reputationText}`);

    const wu = s.player.skills.find((x) => x.name === '武技');
    out.push(`武技 ${wu.level}（上限 ${s.player.talent?.grade === '传说' ? 200 : 100}）`);
  } catch (e) {
    out.push('EXCEPTION ' + (e && e.stack ? e.stack : e));
  }
  out.push('');
}
document.getElementById('out').textContent = out.join('\n');
</script></body></html>
